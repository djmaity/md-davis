# Development environment for MD DaVis.
# Create it from the repository root with:
#   conda env create --file environment_dev.yml
#   conda activate md-davis-dev
#   pip install --no-deps --editable .

name: md-davis-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12,<3.15
  - pip>=25

  # Runtime and optional integrations
  - biopandas>=0.5.1
  - biopython>=1.87
  - h5py>=3.16
  - matplotlib>=3.11
  - mdtraj>=1.11
  - numpy>=2.4
  - pandas>=2.3
  - plotly>=6.9
  - scipy>=1.17
  - pymol-open-source>=3.1,<4
  - wxpython>=4.2.4,<5

  # Test, quality, documentation, and packaging tools
  - python-build>=1.3
  - myst-parser>=4
  - pre-commit>=4
  - pydata-sphinx-theme>=0.16
  - pytest>=8.4
  - pytest-cov>=6
  - ruff>=0.12
  - sphinx>=8.2
  - sphinx-design>=0.6
  - sphinx-favicon>=1
  - sphinx-tabs>=3.4
  - tox>=4.28
  - twine>=6
