[tox]
min_version = 4.28
env_list = py312, py313, py314, lint, docs, build
skip_missing_interpreters = true

[testenv]
package = wheel
extras = test
commands =
    pytest --cov=md_davis --cov-report=term-missing {posargs}

[testenv:lint]
skip_install = true
deps = ruff>=0.12
commands =
    ruff check md_davis tests
    ruff format --check md_davis tests

[testenv:docs]
extras = docs
commands =
    sphinx-build -W --keep-going -b html docs/source {toxworkdir}/docs

[testenv:build]
skip_install = true
deps =
    build>=1.3
    twine>=6
commands =
    python -m build --outdir {toxworkdir}/dist
    twine check {toxworkdir}/dist/*
